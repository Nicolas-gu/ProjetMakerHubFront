<div class="main-nav-bar" [class.centered]="!_tokenService.isLoggedIn()">
    @if(_tokenService.isLoggedIn()){
        <button routerLink="home" class="btn btn-square nav-button">
        <mat-icon>home</mat-icon>
        </button>
    }
    <h1>MealForge</h1>
    @if(_tokenService.isLoggedIn()){
        <button matButton [matMenuTriggerFor]="menu" class="btn btn-square nav-button"><mat-icon>menu</mat-icon></button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item class="btn full-width" routerLink="pantry-item"><mat-icon>local_pizza</mat-icon>Ingrédients à la maison</button>
                <button mat-menu-item class="btn full-width" routerLink="ingredient-list"><mat-icon>local_pizza</mat-icon>Voir tous les ingrédients</button>
                <button mat-menu-item class="btn full-width" routerLink="favorite" ><mat-icon>star</mat-icon>Recettes favorites</button>
                <button mat-menu-item class="btn full-width" routerLink="planning" ><mat-icon>local_library</mat-icon>Mon planning</button>
                <button mat-menu-item class="btn full-width" (click)="logout()"><mat-icon>logout</mat-icon>Déconnexion</button>
            </mat-menu>
    }
</div>
