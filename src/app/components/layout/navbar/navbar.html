<div class="main-nav-bar" [class.centered]="!isLoggedIn()">
    @if(isLoggedIn()){
        <button routerLink="home" class="btn btn-square nav-button">
        <mat-icon>home</mat-icon>
        </button>
    }
    <h1>MealForge</h1>
    @if(isLoggedIn()){
        <button matButton [matMenuTriggerFor]="menu" class="btn btn-square nav-button"><mat-icon>menu</mat-icon></button>
            <mat-menu #menu="matMenu" class="mf-menu">
                @for(item of links; track $index) {
                    @if(item.href) {
                        <button mat-menu-item (click)="stateService.setIsPanningMode(false)" [routerLink]="item.href">{{item.title}}</button>
                    }
                    @else {
                        <button mat-menu-item (click)="item?.handler()">{{item.title}}</button>
                    }
                }
            </mat-menu>
    }
</div>
